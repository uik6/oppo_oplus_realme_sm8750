name: Frida Barebone 6.6.66 模块构建

on:
  workflow_dispatch:
    inputs:
      kernel_suffix:
        description: '目标内核后缀（不含开头的 -；留空使用原默认后缀，必须与 uname -r 匹配）'
        type: string
        default: ''
      kernel_config_url:
        description: '可选：目标内核 .config 的 HTTPS 下载地址；留空使用源码的 gki_defconfig'
        type: string
        default: ''
      cache_epoch:
        description: '缓存代号；需要强制重建全部依赖时修改此值'
        type: string
        default: 'v1'

permissions:
  contents: read

concurrency:
  group: frida-barebone-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  TZ: Asia/Shanghai
  KERNEL_VERSION: '6.6.66'
  KERNEL_REPO: cctv18/android_kernel_common_oneplus_sm8750
  KERNEL_BRANCH: oneplus/sm8750_v_15.0.2_oneplus_13_6.6.66
  KERNEL_NAME: android15-8-g29d86c5fc9dd-abogki428889875-4k
  KERNEL_CLANG_URL: https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang18-r510928/clang-r510928.zip
  FRIDA_VERSION: '17.25.2'
  AGENT_MODULE_NAME: fage
  AGENT_DEVICE_NAME: fage
  RUSTUP_TOOLCHAIN: stable
  CARGO_INCREMENTAL: '0'
  CCACHE_MAXSIZE: 2G
  CCACHE_COMPILERCHECK: content
  CCACHE_COMPRESS: 'true'
  KBUILD_BUILD_USER: frida
  KBUILD_BUILD_HOST: github-actions
  KBUILD_BUILD_TIMESTAMP: '2025-05-25 12:00:00 +0800'
  LOCALVERSION: ''

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: 初始化目录并解析源码版本
        id: sources
        env:
          INPUT_KERNEL_SUFFIX: ${{ inputs.kernel_suffix }}
          INPUT_CONFIG_URL: ${{ inputs.kernel_config_url }}
          INPUT_CACHE_EPOCH: ${{ inputs.cache_epoch }}
        run: |
          set -euo pipefail
          WORKDIR="$GITHUB_WORKSPACE/kernel_workspace"
          mkdir -p "$WORKDIR"
          {
            echo "WORKDIR=$WORKDIR"
            echo "CCACHE_DIR=$HOME/.cache/frida-ccache"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
          } >> "$GITHUB_ENV"

          SUFFIX="${INPUT_KERNEL_SUFFIX:-$KERNEL_NAME}"
          if [[ ! "$SUFFIX" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]; then
            echo '::error::内核后缀只能包含字母、数字、点、下划线、加号和连字符，且不能以连字符开头'
            exit 1
          fi
          echo "KERNEL_LOCALVERSION=-$SUFFIX" >> "$GITHUB_ENV"

          KERNEL_SHA="$(git ls-remote "https://github.com/$KERNEL_REPO.git" \
            "refs/heads/$KERNEL_BRANCH" | awk 'NR == 1 { print $1 }')"
          FRIDA_SHA="$(git ls-remote https://github.com/frida/frida-core.git \
            "refs/tags/$FRIDA_VERSION" "refs/tags/$FRIDA_VERSION^{}" | awk 'END { print $1 }')"
          [[ "$KERNEL_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$FRIDA_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "KERNEL_SHA=$KERNEL_SHA" >> "$GITHUB_ENV"
          echo "FRIDA_SHA=$FRIDA_SHA" >> "$GITHUB_ENV"

          # 配置内容参与缓存键；相同 URL 的内容变更也会重建内核依赖。
          : > "$WORKDIR/kernel.config.input"
          if [ -n "$INPUT_CONFIG_URL" ]; then
            [[ "$INPUT_CONFIG_URL" == https://* ]]
            curl --fail --location --retry 5 --proto '=https' --proto-redir '=https' \
              "$INPUT_CONFIG_URL" -o "$WORKDIR/kernel.config.input"
            grep -q '^CONFIG_ARM64=y' "$WORKDIR/kernel.config.input"
          fi
          EPOCH="$(printf '%s' "$INPUT_CACHE_EPOCH" | sha256sum | cut -c1-16)"
          {
            echo "epoch=$EPOCH"
            echo "frida=$FRIDA_SHA"
            echo "clang=$(printf '%s' "$KERNEL_CLANG_URL" | sha256sum | cut -c1-24)"
          } >> "$GITHUB_OUTPUT"

      - name: 安装构建依赖
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison flex build-essential libssl-dev libelf-dev libzstd-dev \
            python3 python3-pyelftools curl git unzip xz-utils zstd ccache dwarves kmod \
            binutils-aarch64-linux-gnu clang-19 libclang-19-dev
          echo 'FRIDA_AGENT_CLANG=/usr/bin/clang-19' >> "$GITHUB_ENV"
          echo 'LIBCLANG_PATH=/usr/lib/llvm-19/lib' >> "$GITHUB_ENV"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup component add rust-src
          rustup target add aarch64-unknown-none
          rustc --version
          /usr/bin/clang-19 --version

      - name: 恢复内核 Clang 工具链
        id: clang-cache
        uses: actions/cache/restore@v5
        with:
          path: kernel_workspace/clang18
          key: frida-clang18-${{ runner.os }}-${{ steps.sources.outputs.clang }}-${{ steps.sources.outputs.epoch }}

      - name: 下载内核 Clang 工具链
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 "$KERNEL_CLANG_URL" -o "$RUNNER_TEMP/clang18.zip"
          mkdir -p "$WORKDIR/clang18"
          unzip -q "$RUNNER_TEMP/clang18.zip" -d "$WORKDIR/clang18"
          test -x "$WORKDIR/clang18/bin/clang"
          rm -f "$RUNNER_TEMP/clang18.zip"

      - name: 保存内核 Clang 工具链
        if: steps.clang-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: kernel_workspace/clang18
          key: ${{ steps.clang-cache.outputs.cache-primary-key }}

      - name: 恢复 Frida 源码、GumJS 与 SDK
        id: frida-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            kernel_workspace/frida-core
            kernel_workspace/gumjs-devkit
            kernel_workspace/sdk-none-arm64-softfloat_nopic
          key: frida-sdk-${{ runner.os }}-${{ steps.sources.outputs.frida }}-${{ steps.sources.outputs.epoch }}

      - name: 下载 Frida 源码和依赖
        if: steps.frida-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth=1 --single-branch --branch "$FRIDA_VERSION" \
            https://github.com/frida/frida-core.git "$WORKDIR/frida-core"
          test "$(git -C "$WORKDIR/frida-core" rev-parse HEAD)" = "$FRIDA_SHA"
          # SDK 同步工具依赖 releng 内部固定版本的 tomlkit 和 Meson 子模块。
          git -C "$WORKDIR/frida-core" submodule update --init --recursive --depth=1 releng
          python3 "$WORKDIR/frida-core/releng/deps.py" --help > /dev/null

          # 独立下载任务并行运行，逐个等待，任一失败都会使步骤失败。
          (
            curl --fail --location --retry 5 \
              "https://github.com/frida/frida/releases/download/$FRIDA_VERSION/frida-gumjs-devkit-$FRIDA_VERSION-none-arm64-softfloat_nopic.tar.xz" \
              -o "$RUNNER_TEMP/frida-gumjs.tar.xz"
            mkdir -p "$WORKDIR/gumjs-devkit"
            tar -xJf "$RUNNER_TEMP/frida-gumjs.tar.xz" -C "$WORKDIR/gumjs-devkit"
            rm -f "$RUNNER_TEMP/frida-gumjs.tar.xz"
          ) &
          GUMJS_PID=$!
          (
            cd "$WORKDIR/frida-core"
            ./releng/deps.py sync sdk none-arm64-softfloat_nopic \
              "$WORKDIR/sdk-none-arm64-softfloat_nopic"
          ) &
          SDK_PID=$!
          STATUS=0
          wait "$GUMJS_PID" || STATUS=1
          wait "$SDK_PID" || STATUS=1
          exit "$STATUS"

      - name: 保存未修改的 Frida 源码和依赖
        if: steps.frida-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            kernel_workspace/frida-core
            kernel_workspace/gumjs-devkit
            kernel_workspace/sdk-none-arm64-softfloat_nopic
          key: ${{ steps.frida-cache.outputs.cache-primary-key }}

      - name: 生成内核依赖构建脚本和缓存键
        id: keys
        env:
          CACHE_EPOCH: ${{ steps.sources.outputs.epoch }}
        run: |
          set -euo pipefail
          echo "$WORKDIR/clang18/bin" >> "$GITHUB_PATH"
          cat > "$RUNNER_TEMP/prepare-frida-kernel.sh" <<'KERNEL_SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          KDIR="$WORKDIR/common"
          KOUT="$KDIR/out"
          mkdir -p "$KDIR"
          curl --fail --location --retry 5 \
            "https://codeload.github.com/$KERNEL_REPO/tar.gz/$KERNEL_SHA" \
            -o "$RUNNER_TEMP/kernel.tar.gz"
          tar -xzf "$RUNNER_TEMP/kernel.tar.gz" --strip-components=1 -C "$KDIR"
          rm -f "$RUNNER_TEMP/kernel.tar.gz"
          # 清除上游快照可能携带的配置，保持 O= 构建的源码树干净。
          rm -f "$KDIR/.config"
          rm -rf "$KDIR/include/config" "$KDIR/arch/arm64/include/generated"
          export PATH="$WORKDIR/clang18/bin:$PATH"
          MAKE_ARGS=(-C "$KDIR" O="$KOUT" ARCH=arm64 LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu- CC='ccache clang' HOSTCC=gcc HOSTCXX=g++)
          if [ -s "$WORKDIR/kernel.config.input" ]; then
            mkdir -p "$KOUT"
            cp "$WORKDIR/kernel.config.input" "$KOUT/.config"
          else
            make "${MAKE_ARGS[@]}" gki_defconfig
          fi
          "$KDIR/scripts/config" --file "$KOUT/.config" \
            --set-str LOCALVERSION "$KERNEL_LOCALVERSION" \
            --disable LOCALVERSION_AUTO --disable HEADERS_INSTALL
          make "${MAKE_ARGS[@]}" olddefconfig
          for OPT in CONFIG_MODULES CONFIG_KPROBES CONFIG_KALLSYMS_ALL; do
            if ! grep -q "^$OPT=y$" "$KOUT/.config"; then
              echo "::error::目标配置需要 $OPT=y"
              exit 1
            fi
          done
          if grep -qE '^CONFIG_(MODULE_SIG_FORCE|TRIM_UNUSED_KSYMS)=y$' "$KOUT/.config"; then
            echo '::error::此工作流要求关闭 MODULE_SIG_FORCE 和 TRIM_UNUSED_KSYMS'
            exit 1
          fi

          # modpost 依赖 vmlinux.o，生成真实 CRC；modules_prepare 生成外部模块工具。
          # 跳过最终 vmlinux 链接、Image、DTB 和所有内置 .ko 的构建。
          make -j"$(nproc)" "${MAKE_ARGS[@]}" modpost modules_prepare
          test -s "$KOUT/vmlinux.symvers"
          cp "$KOUT/vmlinux.symvers" "$KOUT/Module.symvers"

          # 缓存只保留外部模块所需目录，避免存储数 GB 的内核中间目标文件。
          PREPARED="$WORKDIR/kernel-prepared"
          mkdir -p "$PREPARED/arch/arm64"
          cp -a "$KOUT/.config" "$KOUT/Makefile" "$KOUT/Module.symvers" \
            "$KOUT/include" "$KOUT/scripts" "$PREPARED/"
          cp -a "$KOUT/arch/arm64/include" "$PREPARED/arch/arm64/"
          ln -s "$KDIR" "$PREPARED/source"
          rm -rf "$KOUT"
          mv "$PREPARED" "$KOUT"
          KERNEL_SCRIPT

          # 源码、实际配置、构建脚本和编译器任何一个变化都会使依赖缓存失效。
          KERNEL_KEY="$(
            {
              printf '%s\n' "$CACHE_EPOCH" "$KERNEL_SHA" "$KERNEL_LOCALVERSION"
              sha256sum "$RUNNER_TEMP/prepare-frida-kernel.sh" "$WORKDIR/kernel.config.input"
              "$WORKDIR/clang18/bin/clang" --version
              gcc --version
            } | sha256sum | cut -d ' ' -f1
          )"
          TOOL_KEY="$(
            {
              rustc -vV
              "$FRIDA_AGENT_CLANG" --version
              "$WORKDIR/clang18/bin/clang" --version
              aarch64-linux-gnu-ld --version
            } | sha256sum | cut -c1-24
          )"
          # 编译缓存可跨配置回退，Kbuild/ccache/Cargo 自己检查内容与依赖；
          # 已准备内核的缓存必须精确命中，禁止回退到其他配置的 Module.symvers。
          WORKFLOW_HASH="${GITHUB_WORKFLOW_SHA:-$GITHUB_SHA}"
          {
            echo "kernel=frida-kernel-${RUNNER_OS}-$KERNEL_KEY"
            echo "compile-prefix=frida-compile-${RUNNER_OS}-$CACHE_EPOCH-$TOOL_KEY-"
            echo "compile=frida-compile-${RUNNER_OS}-$CACHE_EPOCH-$TOOL_KEY-$KERNEL_KEY-$FRIDA_SHA-$WORKFLOW_HASH"
          } >> "$GITHUB_OUTPUT"

      - name: 恢复已准备的内核环境
        id: kernel-cache
        uses: actions/cache/restore@v5
        with:
          path: kernel_workspace/common
          key: ${{ steps.keys.outputs.kernel }}

      - name: 恢复 Cargo 和 C 编译缓存
        id: compile-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cache/frida-ccache
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            kernel_workspace/frida-core/src/barebone/agent/target-linux
          key: ${{ steps.keys.outputs.compile }}
          restore-keys: |
            ${{ steps.keys.outputs.compile-prefix }}

      - name: 首次生成内核依赖
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ccache --max-size "$CCACHE_MAXSIZE"
          ccache --zero-stats
          bash "$RUNNER_TEMP/prepare-frida-kernel.sh"

      - name: 验证内核和 Frida 依赖
        run: |
          set -euo pipefail
          KOUT="$WORKDIR/common/out"
          for REQUIRED in \
            "$KOUT/.config" \
            "$KOUT/Module.symvers" \
            "$KOUT/include/config/auto.conf" \
            "$KOUT/include/generated/autoconf.h" \
            "$KOUT/include/config/kernel.release" \
            "$KOUT/scripts/mod/modpost" \
            "$KOUT/scripts/module.lds" \
            "$WORKDIR/gumjs-devkit/libfrida-gumjs.a" \
            "$WORKDIR/sdk-none-arm64-softfloat_nopic/lib/libc.a" \
            "$WORKDIR/sdk-none-arm64-softfloat_nopic/lib/libm.a" \
            "$WORKDIR/sdk-none-arm64-softfloat_nopic/lib/libclang_rt.builtins.a"
          do
            test -s "$REQUIRED"
          done
          EXPECTED_RELEASE="$KERNEL_VERSION$KERNEL_LOCALVERSION"
          test "$(cat "$KOUT/include/config/kernel.release")" = "$EXPECTED_RELEASE"
          echo "Kernel release: $EXPECTED_RELEASE"
          echo "Kernel commit: $KERNEL_SHA"
          wc -l "$KOUT/Module.symvers"
          du -sh "$WORKDIR/common" "$WORKDIR/clang18"

      - name: 保存已准备的内核环境
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: kernel_workspace/common
          key: ${{ steps.kernel-cache.outputs.cache-primary-key }}

      - name: 应用 Frida Android 6.6 / OPlus 兼容补丁
        run: |
          set -euxo pipefail

          FRIDA_LINUX="$WORKDIR/frida-core/src/barebone/agent/linux"
          export FRIDA_LINUX

          test -f "$FRIDA_LINUX/frida-kmod.c"
          test -f "$FRIDA_LINUX/Kbuild"

          python3 <<'PY_PATCH'
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["FRIDA_LINUX"])
          src = root / "frida-kmod.c"
          kbuild = root / "Kbuild"

          text = src.read_text()
          # Normalize markers from an older patched source cache before applying
          # the idempotent compatibility patches below.
          for key in ("compat", "context_compat", "callback_compat", "thread_abi", "init_compat"):
              text = text.replace(f'MODULE_INFO (frida_{key},', f'MODULE_INFO (fage_{key},')

          # Frida 17.25.2 assumes the newer detach_pid(freed, task, type) API.
          # Android 6.6 uses detach_pid(task, type), which frees unused PIDs itself.
          # Calling it with the newer prototype triggers a fatal CFI failure.
          pid_header = Path(os.environ["WORKDIR"]) / "common/include/linux/pid.h"
          legacy_detach = re.compile(
              r"\bvoid\s+detach_pid\s*\(\s*struct\s+task_struct\s*\*\s*\w*\s*,"
              r"\s*enum\s+pid_type\s*\w*\s*\)\s*;"
          )
          if not legacy_detach.search(pid_header.read_text()):
              raise SystemExit('expected Android 6.6 two-argument detach_pid declaration')

          pid_include = '#include <linux/pid.h>\n'
          if pid_include not in text:
              needle = '#include <linux/poll.h>\n'
              if needle not in text:
                  raise SystemExit('cannot locate linux/poll.h include')
              text = text.replace(needle, pid_include + needle, 1)

          typed_detach = 'typedef __typeof__ (&detach_pid) FridaDetachPidFunc;'
          if typed_detach not in text:
              replacements = [
                  (
                      'typedef void (* FridaDetachPidFunc) (struct pid ** pids, struct task_struct * task, enum pid_type type);',
                      typed_detach,
                  ),
                  ('typedef void (* FridaFreePidsFunc) (struct pid ** pids);\n', ''),
                  ('static FridaFreePidsFunc frida_free_pids_impl;\n', ''),
                  ('  frida_free_pids_impl = (FridaFreePidsFunc) frida_kmod_find_function ("free_pids");\n', ''),
                  ('  struct pid * freed[PIDTYPE_MAX] = { NULL };\n', ''),
                  ('  frida_free_pids_impl (freed);\n', ''),
              ]
              for pid_type in ('SID', 'PGID', 'TGID'):
                  replacements.append((
                      f'  frida_detach_pid_impl (freed, child, PIDTYPE_{pid_type});',
                      f'  frida_detach_pid_impl (child, PIDTYPE_{pid_type});',
                  ))
              for old, new in replacements:
                  if text.count(old) != 1:
                      raise SystemExit(f'cannot uniquely locate PID compatibility patch target: {old}')
                  text = text.replace(old, new, 1)

          if 'frida_free_pids_impl' in text or 'frida_detach_pid_impl (freed,' in text:
              raise SystemExit('incompatible PID API remains after patch')
          compat_info = 'MODULE_INFO (fage_compat, "android6.6-pid-v1");'
          if compat_info not in text:
              text += '\n' + compat_info + '\n'

          # Android/Linux 6.6 keeps the full struct kernel_symbol definition in
          # kernel/module/internal.h while linux/module.h only forward-declares it.
          # Frida 17.25.2 directly dereferences kernel_symbol fields, so make the
          # target kernel's internal definition visible to this external module.
          needle = '#include <linux/module.h>\n'
          replacement = '#include <linux/module.h>\n#include "internal.h"\n'
          if '#include "internal.h"' not in text:
              if needle not in text:
                  raise SystemExit('cannot locate linux/module.h include')
              text = text.replace(needle, replacement, 1)

          # task_struct::sysvsem only exists when CONFIG_SYSVIPC=y. Frida 17.25.2
          # accesses it unconditionally. On Android GKI/OKI kernels with SYSVIPC
          # disabled, there is no semaphore undo-list state to inherit, so compile
          # that part only when the kernel actually provides the field.
          old_decl = '  void * undo_list = leader->sysvsem.undo_list;\n'
          new_decl = '#ifdef CONFIG_SYSVIPC\n  void * undo_list = leader->sysvsem.undo_list;\n#endif\n'
          if new_decl not in text:
              if old_decl not in text:
                  raise SystemExit('cannot locate sysvsem declaration')
              text = text.replace(old_decl, new_decl, 1)

          old_use = '  if (undo_list != NULL)\n  {\n    refcount_inc (&((struct frida_sem_undo_list *) undo_list)->refcnt);\n    current->sysvsem.undo_list = undo_list;\n  }\n'
          new_use = '#ifdef CONFIG_SYSVIPC\n  if (undo_list != NULL)\n  {\n    refcount_inc (&((struct frida_sem_undo_list *) undo_list)->refcnt);\n    current->sysvsem.undo_list = undo_list;\n  }\n#endif\n'
          if new_use not in text:
              if old_use not in text:
                  raise SystemExit('cannot locate sysvsem use block')
              text = text.replace(old_use, new_use, 1)

          if text != src.read_text():
              src.write_text(text)

          ktext = kbuild.read_text()
          inc = 'ccflags-y += -I$(srctree)/kernel/module\n'
          if inc not in ktext:
              ktext += '\n# Android 6.6 keeps struct kernel_symbol in kernel/module/internal.h\n' + inc
          if ktext != kbuild.read_text():
              kbuild.write_text(ktext)
          PY_PATCH

          echo "=== 验证 Frida 兼容补丁 ==="
          grep -n -E 'FridaDetachPidFunc|frida_detach_pid_impl \(child|fage_compat' "$FRIDA_LINUX/frida-kmod.c"
          grep -n 'include "internal.h"' "$FRIDA_LINUX/frida-kmod.c"
          grep -n -A4 -B2 'undo_list = leader->sysvsem.undo_list' "$FRIDA_LINUX/frida-kmod.c"
          tail -n 8 "$FRIDA_LINUX/Kbuild"

      - name: 修复模块通知回调的 C / Rust CFI 边界
        run: |
          set -euo pipefail
          export FRIDA_KMOD="$WORKDIR/frida-core/src/barebone/agent/linux/frida-kmod.c"

          python3 <<'PY_CALLBACK_CFI'
          import os
          from pathlib import Path

          p = Path(os.environ["FRIDA_KMOD"])
          text = p.read_text()
          # The callback uses the C ABI, but the freestanding Rust agent is not
          # built with kernel KCFI metadata. The notifier adapter must use the
          # same boundary annotation as frida_thread_trampoline and the module
          # enumeration adapters. Keep CFI enabled for the rest of the module.
          replacements = (
              (
                  'static int frida_kmod_on_module_state (struct notifier_block * nb, unsigned long action,\n',
                  'static int __nocfi frida_kmod_on_module_state (struct notifier_block * nb, unsigned long action,\n',
              ),
              (
                  'static int\nfrida_kmod_on_module_state (struct notifier_block * nb, unsigned long action, void * data)\n',
                  '/* The C-ABI Rust callback has no kernel KCFI type metadata. */\n'
                  'static int __nocfi\nfrida_kmod_on_module_state (struct notifier_block * nb, unsigned long action, void * data)\n',
              ),
          )
          for old, new in replacements:
              if new in text:
                  if text.count(new) != 1 or old in text:
                      raise SystemExit('ambiguous module notifier CFI boundary')
                  continue
              if text.count(old) != 1:
                  raise SystemExit(f'cannot uniquely locate module notifier CFI patch target: {old}')
              text = text.replace(old, new, 1)

          # Keep module notifications working; do not bypass registration or the
          # Rust callback to avoid the panic. Audit the other C-to-agent adapters.
          for needle in (
              '.notifier_call = frida_kmod_on_module_state,',
              '  register_module_notifier (&frida_kmod_module_notifier);',
              '  unregister_module_notifier (&frida_kmod_module_notifier);',
              '  frida_kmod_module_event_func (loaded, mod->name, "", base, size,',
              'static int __nocfi\nfrida_thread_trampoline (void * data)',
              'static int __nocfi\nfrida_on_each_symbol (void * data,',
              'void __nocfi\nfrida_kmod_enumerate_modules (',
              'int __nocfi\nfrida_kmod_enumerate_module_symbols (',
              'int __nocfi\nfrida_kmod_enumerate_module_exports (',
          ):
              if text.count(needle) != 1:
                  raise SystemExit(f'C/Rust callback boundary verification failed: {needle}')

          marker = 'MODULE_INFO (fage_callback_compat, "module-notifier-cfi-v1");'
          if marker not in text:
              text += '\n' + marker + '\n'
          if text.count(marker) != 1:
              raise SystemExit('ambiguous module notifier compatibility marker')
          if text != p.read_text():
              p.write_text(text)
          PY_CALLBACK_CFI

          grep -n -A24 -B2 '^frida_kmod_on_module_state (' "$FRIDA_KMOD"

      - name: 继承 Android arm64 带标签地址 ABI
        run: |
          set -euo pipefail
          export FRIDA_KMOD="$WORKDIR/frida-core/src/barebone/agent/linux/frida-kmod.c"

          python3 <<'PY_TAGGED_ADDR'
          import os
          from pathlib import Path

          p = Path(os.environ["FRIDA_KMOD"])
          text = p.read_text()
          old = (
              '  frida_reparent_into_group (ctx.leader);\n'
              '  put_task_struct (ctx.leader);\n'
          )
          new = (
              '  frida_reparent_into_group (ctx.leader);\n'
              '#ifdef CONFIG_ARM64_TAGGED_ADDR_ABI\n'
              '  /* user_mode_thread() inherits the kernel worker flags. Adopt the\n'
              '   * target tagged-address ABI before entering userspace or creating\n'
              '   * pthreads, otherwise ART futex calls on tagged pointers fail with\n'
              '   * EFAULT. Keep all other task flags and MTE controls unchanged. */\n'
              '  update_thread_flag (TIF_TAGGED_ADDR,\n'
              '      test_tsk_thread_flag (ctx.leader, TIF_TAGGED_ADDR));\n'
              '#endif\n'
              '  put_task_struct (ctx.leader);\n'
          )
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit('cannot uniquely locate userspace thread ABI handoff')
              text = text.replace(old, new, 1)
          if text.count(new) != 1 or old in text:
              raise SystemExit('tagged-address ABI handoff verification failed')

          marker = 'MODULE_INFO (fage_thread_abi, "arm64-tagged-addr-v1");'
          if marker not in text:
              text += '\n' + marker + '\n'
          if text.count(marker) != 1:
              raise SystemExit('ambiguous thread ABI compatibility marker')
          if text != p.read_text():
              p.write_text(text)
          PY_TAGGED_ADDR

          grep -n -A13 -B2 'target tagged-address ABI' "$FRIDA_KMOD"

      - name: 修复内核注入线程的凭据和进程计数迁移
        run: |
          set -euo pipefail
          export FRIDA_KMOD="$WORKDIR/frida-core/src/barebone/agent/linux/frida-kmod.c"

          python3 <<'PY_UCOUNTS'
          import os
          from pathlib import Path

          p = Path(os.environ["FRIDA_KMOD"])
          text = p.read_text()
          marker = 'MODULE_INFO (fage_context_compat, "ucounts-v1");'

          if marker not in text:
              replacements = [
                  (
                      '#include <linux/delay.h>\n',
                      '#include <linux/cred.h>\n#include <linux/delay.h>\n#include <linux/user_namespace.h>\n',
                  ),
                  (
                      'typedef void (* FridaFreeFsStructFunc) (struct fs_struct * fs);\n',
                      'typedef void (* FridaFreeFsStructFunc) (struct fs_struct * fs);\n'
                      'typedef __typeof__ (&get_task_cred) FridaGetTaskCredFunc;\n'
                      'typedef __typeof__ (&inc_rlimit_ucounts) FridaIncRlimitUcountsFunc;\n'
                      'typedef __typeof__ (&dec_rlimit_ucounts) FridaDecRlimitUcountsFunc;\n',
                  ),
                  (
                      'static FridaFreeFsStructFunc frida_free_fs_struct_impl;\n',
                      'static FridaFreeFsStructFunc frida_free_fs_struct_impl;\n'
                      'static FridaGetTaskCredFunc frida_get_task_cred_impl;\n'
                      'static FridaIncRlimitUcountsFunc frida_inc_rlimit_ucounts_impl;\n'
                      'static FridaDecRlimitUcountsFunc frida_dec_rlimit_ucounts_impl;\n',
                  ),
                  (
                      '  frida_free_fs_struct_impl = (FridaFreeFsStructFunc) frida_kmod_find_function ("free_fs_struct");\n',
                      '  frida_free_fs_struct_impl = (FridaFreeFsStructFunc) frida_kmod_find_function ("free_fs_struct");\n'
                      '  frida_get_task_cred_impl = (FridaGetTaskCredFunc) frida_kmod_find_function ("get_task_cred");\n'
                      '  frida_inc_rlimit_ucounts_impl = (FridaIncRlimitUcountsFunc) frida_kmod_find_function ("inc_rlimit_ucounts");\n'
                      '  frida_dec_rlimit_ucounts_impl = (FridaDecRlimitUcountsFunc) frida_kmod_find_function ("dec_rlimit_ucounts");\n',
                  ),
                  (
                      '  struct frida_spawn_ctx * ctx;\n\n  mm = frida_grab_process_mm (pid);\n',
                      '  struct frida_spawn_ctx * ctx;\n\n'
                      '  if (frida_get_task_cred_impl == NULL ||\n'
                      '      frida_inc_rlimit_ucounts_impl == NULL || frida_dec_rlimit_ucounts_impl == NULL)\n'
                      '  {\n'
                      '    pr_err_ratelimited ("frida: required credential/accounting functions are unavailable\\n");\n'
                      '    return -EOPNOTSUPP;\n'
                      '  }\n\n'
                      '  mm = frida_grab_process_mm (pid);\n',
                  ),
                  (
                      '  const struct cred * old_real_cred = current->real_cred;\n',
                      '  const struct cred * old_real_cred = current->real_cred;\n'
                      '  const struct cred * target_cred = frida_get_task_cred_impl (leader);\n'
                      '  bool transfer_nproc = target_cred->ucounts != old_real_cred->ucounts;\n',
                  ),
                  (
                      '  current->real_cred = get_cred (leader->real_cred);\n'
                      '  rcu_assign_pointer (current->cred, get_cred (leader->cred));\n'
                      '  put_cred (old_cred);\n'
                      '  put_cred (old_real_cred);\n',
                      '  /* copy_creds() charged this task to the kernel worker. Transfer that\n'
                      '   * charge before adopting the target credentials, so release_task()\n'
                      '   * decrements the same account. Do not use commit_creds() here: its\n'
                      '   * privilege-drop handling would change the target mm dumpability. */\n'
                      '  if (transfer_nproc)\n'
                      '    frida_inc_rlimit_ucounts_impl (target_cred->ucounts, UCOUNT_RLIMIT_NPROC, 1);\n\n'
                      '  rcu_assign_pointer (current->real_cred, target_cred);\n'
                      '  rcu_assign_pointer (current->cred, get_cred (target_cred));\n\n'
                      '  if (transfer_nproc)\n'
                      '    frida_dec_rlimit_ucounts_impl (old_real_cred->ucounts, UCOUNT_RLIMIT_NPROC, 1);\n'
                      '  put_cred (old_cred);\n'
                      '  put_cred (old_real_cred);\n',
                  ),
              ]
              for old, new in replacements:
                  if text.count(old) != 1:
                      raise SystemExit(f'cannot uniquely locate credential/accounting patch target: {old}')
                  text = text.replace(old, new, 1)
              text += '\n' + marker + '\n'

          required = (
              'frida_inc_rlimit_ucounts_impl (target_cred->ucounts, UCOUNT_RLIMIT_NPROC, 1);',
              'frida_dec_rlimit_ucounts_impl (old_real_cred->ucounts, UCOUNT_RLIMIT_NPROC, 1);',
              'rcu_assign_pointer (current->real_cred, target_cred);',
          )
          if any(text.count(needle) != 1 for needle in required):
              raise SystemExit('credential/accounting patch verification failed')
          if 'current->real_cred = get_cred (leader->real_cred);' in text:
              raise SystemExit('unaccounted credential switch remains')
          if text != p.read_text():
              p.write_text(text)
          PY_UCOUNTS

          grep -n -A22 -B2 'copy_creds() charged' "$FRIDA_KMOD"

      - name: 修复 Frida Android FIFO 分配并增加运行时诊断
        run: |
          set -euxo pipefail

          FRIDA_KMOD="$WORKDIR/frida-core/src/barebone/agent/linux/frida-kmod.c"
          export FRIDA_KMOD
          test -f "$FRIDA_KMOD"

          python3 <<'PY_FIFO'
          import os
          import re
          from pathlib import Path

          p = Path(os.environ["FRIDA_KMOD"])
          text = p.read_text()

          # Add explicit backing-storage pointers next to the two kfifo objects.
          decl_re = re.compile(
              r"(static DECLARE_KFIFO_PTR \(frida_to_client, u8\);\s*\n"
              r"static DECLARE_KFIFO_PTR \(frida_from_client, u8\);\s*\n)"
          )
          if "frida_to_client_storage" not in text:
              text, n = decl_re.subn(
                  r"\1static void * frida_to_client_storage;\n"
                  r"static void * frida_from_client_storage;\n",
                  text,
                  count=1,
              )
              if n != 1:
                  raise SystemExit("cannot locate FIFO declarations")

          # Match the allocation block while tolerating blank lines/whitespace.
          alloc_re = re.compile(
              r"  res = kfifo_alloc \(&frida_to_client, FRIDA_LINK_CAPACITY, GFP_KERNEL\);\s*\n"
              r"  if \(res != 0\)\s*\n"
              r"    return res;\s*\n+"
              r"  res = kfifo_alloc \(&frida_from_client, FRIDA_LINK_CAPACITY, GFP_KERNEL\);\s*\n"
              r"  if \(res != 0\)\s*\n"
              r"    goto free_to_client;"
          )
          new_alloc = (
              "  frida_to_client_storage = kvzalloc (FRIDA_LINK_CAPACITY, GFP_KERNEL);\n"
              "  if (frida_to_client_storage == NULL)\n"
              "  {\n"
              "    printk (KERN_ERR \"frida: failed to allocate to-client FIFO storage (%u bytes)\\n\", FRIDA_LINK_CAPACITY);\n"
              "    return -ENOMEM;\n"
              "  }\n"
              "  res = kfifo_init (&frida_to_client, frida_to_client_storage, FRIDA_LINK_CAPACITY);\n"
              "  if (res != 0)\n"
              "  {\n"
              "    printk (KERN_ERR \"frida: kfifo_init(to-client) failed: %d\\n\", res);\n"
              "    goto free_to_client;\n"
              "  }\n"
              "\n"
              "  frida_from_client_storage = kvzalloc (FRIDA_LINK_CAPACITY, GFP_KERNEL);\n"
              "  if (frida_from_client_storage == NULL)\n"
              "  {\n"
              "    res = -ENOMEM;\n"
              "    printk (KERN_ERR \"frida: failed to allocate from-client FIFO storage (%u bytes)\\n\", FRIDA_LINK_CAPACITY);\n"
              "    goto free_to_client;\n"
              "  }\n"
              "  res = kfifo_init (&frida_from_client, frida_from_client_storage, FRIDA_LINK_CAPACITY);\n"
              "  if (res != 0)\n"
              "  {\n"
              "    printk (KERN_ERR \"frida: kfifo_init(from-client) failed: %d\\n\", res);\n"
              "    goto free_from_client;\n"
              "  }"
          )

          if "failed to allocate to-client FIFO storage" not in text:
              text, n = alloc_re.subn(lambda m: new_alloc, text, count=1)
              if n != 1:
                  pos = text.find("frida_kmod_link_open (void)")
                  snippet = text[pos:pos + 1100] if pos >= 0 else "<link_open not found>"
                  raise SystemExit(
                      "cannot locate FIFO allocation block after whitespace-tolerant match; "
                      "link_open begins as:\n" + snippet
                  )

          labels_re = re.compile(
              r"free_from_client:\s*\n"
              r"  kfifo_free \(&frida_from_client\);\s*\n"
              r"free_to_client:\s*\n"
              r"  kfifo_free \(&frida_to_client\);"
          )
          new_labels = (
              "free_from_client:\n"
              "  kvfree (frida_from_client_storage);\n"
              "  frida_from_client_storage = NULL;\n"
              "free_to_client:\n"
              "  kvfree (frida_to_client_storage);\n"
              "  frida_to_client_storage = NULL;"
          )

          if "free_from_client:\n  kvfree (frida_from_client_storage);" not in text:
              text, n = labels_re.subn(lambda m: new_labels, text, count=1)
              if n != 1:
                  raise SystemExit("cannot locate frida_kmod_link_open() cleanup labels")

          close_re = re.compile(
              r"  misc_deregister \(&frida_dev\);\s*\n"
              r"  kfifo_free \(&frida_from_client\);\s*\n"
              r"  kfifo_free \(&frida_to_client\);"
          )
          new_close = (
              "  misc_deregister (&frida_dev);\n"
              "  kvfree (frida_from_client_storage);\n"
              "  frida_from_client_storage = NULL;\n"
              "  kvfree (frida_to_client_storage);\n"
              "  frida_to_client_storage = NULL;"
          )

          if "misc_deregister (&frida_dev);\n  kvfree (frida_from_client_storage);" not in text:
              text, n = close_re.subn(lambda m: new_close, text, count=1)
              if n != 1:
                  raise SystemExit("cannot locate frida_kmod_link_close() cleanup")

          misc_re = re.compile(
              r"  res = misc_register \(&frida_dev\);\s*\n"
              r"  if \(res != 0\)\s*\n"
              r"    goto free_from_client;"
          )
          new_misc = (
              "  res = misc_register (&frida_dev);\n"
              "  if (res != 0)\n"
              "  {\n"
              "    printk (KERN_ERR \"frida: misc_register(/dev/%s) failed: %d\\n\", frida_dev.name, res);\n"
              "    goto free_from_client;\n"
              "  }"
          )

          if "misc_register(/dev/%s) failed" not in text:
              text, n = misc_re.subn(lambda m: new_misc, text, count=1)
              if n != 1:
                  raise SystemExit("cannot locate misc_register() block")

          if text != p.read_text():
              p.write_text(text)
          PY_FIFO

          echo "=== FIFO patch verification ==="
          grep -n -A28 -B5 'frida_to_client_storage = kvzalloc' "$FRIDA_KMOD"
          grep -n -A8 -B3 'misc_register(/dev/%s) failed' "$FRIDA_KMOD"
          grep -n -A14 'frida_kmod_link_close' "$FRIDA_KMOD" | tail -n 18

      - name: 在模块入口执行构造函数并保留旧版节布局
        run: |
          set -euo pipefail
          python3 <<'PY_INIT_ARRAY'
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["WORKDIR"]) / "frida-core/src/barebone/agent/linux"
          linker = root / "prelink.lds"
          source = root / "frida-kmod.c"
          rust_source = root.parent / "src/lib.rs"
          text = linker.read_text()
          old_header = re.compile(r"(?m)^([ \t]*)\.init_array(?=[ \t]+0[ \t]*:)")
          resident_header = re.compile(r"(?m)^([ \t]*)\.frida_init_array(?=[ \t]+0[ \t]*:)")

          # Keep the original ELF layout and CONFIG_CONSTRUCTORS loader behavior.
          # Undo the previous resident-section patch if present in a source cache.
          if resident_header.search(text):
              if len(resident_header.findall(text)) != 1 or old_header.search(text):
                  raise SystemExit("ambiguous constructor output section in prelink.lds")
              text = resident_header.sub(r"\1.init_array", text, count=1)
          if len(old_header.findall(text)) != 1:
              raise SystemExit("cannot locate original constructor output section")
          table = re.search(
              r"(?ms)^[ \t]*\.init_array[ \t]+0[ \t]*:\s*\{([^{}]*)\}", text
          )
          required = ("_agent_init_start = .;", "*(.init_array*)", "_agent_init_end = .;")
          if table is None or any(table.group(1).count(item) != 1 for item in required):
              raise SystemExit("constructor bounds or input selector changed unexpectedly")

          rust = rust_source.read_text()
          begin = '#[cfg(feature = "linux")]\nmod entrypoint_linux {\n'
          end = '\n#[cfg(feature = "linux")]\npub use entrypoint_linux::'
          if rust.count(begin) != 1 or rust.count(end) != 1:
              raise SystemExit("cannot uniquely locate Linux agent entrypoint")
          start = rust.index(begin)
          stop = rust.index(end, start)
          module = rust[start:stop]
          spawn = '        if kernel::spawn_thread(worker, ptr::null_mut()) != 0 {\n'
          worker_init = '            crate::run_constructors();\n            init_gum();\n'
          sync_init = (
              '        // Consume .init_array while module_init still owns its pages.\n'
              '        // Gum initialization, hook installation and transport stay on the worker.\n'
              '        unsafe { crate::run_constructors(); }\n\n'
          )
          if sync_init not in module:
              if module.count(spawn) != 1 or module.count(worker_init) != 1:
                  raise SystemExit("unexpected Linux worker constructor initialization")
              module = module.replace(worker_init, '            init_gum();\n', 1)
              module = module.replace(spawn, sync_init + spawn, 1)
          if (module.count(sync_init) != 1 or module.count('crate::run_constructors();') != 1
                  or module.count(spawn) != 1 or module.index(sync_init) > module.index(spawn)):
              raise SystemExit("constructors must execute once before spawning the Linux worker")
          rust = rust[:start] + module + rust[stop:]
          constructor_fn = '#[cfg(not(feature = "xnu-kext"))]\npub(crate) unsafe fn run_constructors() {'
          inline_constructor_fn = constructor_fn.replace(
              '\npub(crate)', '\n#[cfg_attr(feature = "linux", inline(always))]\npub(crate)', 1
          )
          if inline_constructor_fn not in rust:
              if rust.count(constructor_fn) != 1:
                  raise SystemExit("cannot uniquely locate constructor iterator")
              rust = rust.replace(constructor_fn, inline_constructor_fn, 1)
          if rust.count(inline_constructor_fn) != 1:
              raise SystemExit("ambiguous constructor iterator")

          marker = 'MODULE_INFO (fage_init_compat, "module-init-constructors-v2");'
          previous_marker = 'MODULE_INFO (fage_init_compat, "resident-init-array-v1");'
          code = source.read_text()
          if previous_marker in code:
              if code.count(previous_marker) != 1 or marker in code:
                  raise SystemExit("ambiguous constructor compatibility migration")
              code = code.replace(previous_marker, marker, 1)
          if marker not in code:
              code += "\n" + marker + "\n"
          if code.count(marker) != 1:
              raise SystemExit("ambiguous constructor lifetime compatibility marker")
          if linker.read_text() != text:
              linker.write_text(text)
          if source.read_text() != code:
              source.write_text(code)
          if rust_source.read_text() != rust:
              rust_source.write_text(rust)
          # Relink the small prelinked object even if a source cache carried an
          # older blob. Cargo detects lib.rs changes; retain all dependency caches.
          (root / "frida-agent-prelinked.o.bin").unlink(missing_ok=True)
          print(text, end="")
          print(marker)
          PY_INIT_ARRAY

      - name: 检查隐藏钩子完整性并调整可见标识
        run: |
          set -euo pipefail
          python3 <<'PY_PROFILE'
          import json
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["WORKDIR"]) / "frida-core/src/barebone/agent"
          cfile = root / "linux/frida-kmod.c"
          backend = root / "src/linux/kmod.rs"
          entrypoint = root / "src/lib.rs"
          config = root / "etc/linux-kmod.json"
          code = cfile.read_text()
          bridge = backend.read_text()
          rust = entrypoint.read_text()
          device = os.environ["AGENT_DEVICE_NAME"]
          if not re.fullmatch(r"[a-z][a-z0-9_]{0,14}", device):
              raise SystemExit("invalid fixed device name")
          marker = 'MODULE_INFO (fage_cloak_compat, "hook-integrity-v1");'
          hooks = (
              ("show_map", "show_map"),
              ("show_smap", "show_smap"),
              ("proc_fill_cache", "proc_fill_cache"),
              ("sys_prctl", None),
              ("proc_pid_status", "proc_pid_status"),
              ("do_task_stat", "do_task_stat"),
              ("release_task", "release_task"),
          )

          if marker not in code:
              declaration = 'void frida_kmod_install_hooks (void);'
              old_start = 'void\nfrida_kmod_install_hooks (void)\n{'
              old_end = '\nstatic void\nfrida_remove_cloak_hooks (void)\n'
              if code.count(declaration) != 1 or code.count(old_start) != 1 or code.count(old_end) != 1:
                  raise SystemExit("unexpected hook installation entrypoint")
              start = code.index(old_start)
              stop = code.index(old_end, start)
              old_body = code[start:stop]
              if old_body.count('gum_interceptor_replace (') != len(hooks):
                  raise SystemExit("unexpected hook set; review upstream changes")
              lines = [
                  'int', 'frida_kmod_install_hooks (void)', '{',
                  '  unsigned int i, installed = 0;', '  int result;',
                  '  struct { const char * name; void ** target; void * replacement; void * original; } hooks[] =',
                  '  {',
              ]
              for name, _ in hooks:
                  lines.append(f'    {{ "{name}", &frida_{name}_addr, (void *) frida_{name}, &frida_{name}_orig }},')
              lines += ['  };', '', '  WRITE_ONCE (frida_hooks_ready, false);', '']
              for name, symbol in hooks:
                  lookup = f'"{symbol}"' if symbol is not None else 'FRIDA_SYSCALL_NAME_PRCTL'
                  lines.append(f'  frida_{name}_addr = (void *) frida_kmod_find_symbol ({lookup});')
              for name in ('proc_task_instantiate', 'proc_fd_instantiate', 'proc_fdinfo_instantiate'):
                  lines.append(f'  frida_{name}_addr = (void *) frida_kmod_find_symbol ("{name}");')
              lines += [
                  '',
                  '  for (i = 0; i != ARRAY_SIZE (hooks); i++)',
                  '  {',
                  '    if (*hooks[i].target == NULL)',
                  '    {',
                  '      pr_err ("rt: required hook target unavailable: %s\\n", hooks[i].name);',
                  '      return -ENOENT;',
                  '    }',
                  '  }',
                  '  if (frida_proc_task_instantiate_addr == NULL || frida_proc_fd_instantiate_addr == NULL ||',
                  '      frida_proc_fdinfo_instantiate_addr == NULL)',
                  '  {',
                  '    pr_err ("rt: proc directory classification helpers unavailable\\n");',
                  '    return -ENOENT;',
                  '  }',
                  '',
                  '  frida_op_worker = kthread_run (frida_op_worker_fn, NULL, "rt-control");',
                  '  if (IS_ERR (frida_op_worker))',
                  '  {',
                  '    result = PTR_ERR (frida_op_worker);',
                  '    frida_op_worker = NULL;',
                  '    return result;',
                  '  }',
                  '  frida_interceptor = gum_interceptor_obtain ();',
                  '  gum_interceptor_begin_transaction (frida_interceptor);',
                  '  for (i = 0; i != ARRAY_SIZE (hooks); i++)',
                  '  {',
                  '    result = gum_interceptor_replace (frida_interceptor, *hooks[i].target,',
                  '        hooks[i].replacement, hooks[i].original, NULL);',
                  '    if (result != 0)',
                  '    {',
                  '      pr_err ("rt: hook installation failed: %s (%d)\\n", hooks[i].name, result);',
                  '      goto rollback;',
                  '    }',
                  '    installed++;',
                  '  }',
                  '  gum_interceptor_end_transaction (frida_interceptor);',
                  '  WRITE_ONCE (frida_hooks_ready, true);',
                  '  return 0;',
                  '',
                  'rollback:',
                  '  while (installed != 0)',
                  '    gum_interceptor_revert (frida_interceptor, *hooks[--installed].target);',
                  '  gum_interceptor_end_transaction (frida_interceptor);',
                  '  kthread_stop (frida_op_worker);',
                  '  frida_op_worker = NULL;',
                  '  return -EIO;',
                  '}', '',
              ]
              code = code[:start] + '\n'.join(lines) + code[stop:]
              code = code.replace(declaration, 'int frida_kmod_install_hooks (void);', 1)
              anchor = 'static struct task_struct * frida_op_worker;'
              if code.count(anchor) != 1:
                  raise SystemExit("cannot locate operation worker state")
              code = code.replace(anchor, anchor + '\nstatic bool frida_hooks_ready;\n'
                                  'module_param_named (hooks_ready, frida_hooks_ready, bool, 0444);', 1)
              cleanup = 'frida_remove_cloak_hooks (void)\n{\n  struct frida_cloak * c, * next;'
              if code.count(cleanup) != 1:
                  raise SystemExit("cannot locate hook cleanup")
              code = code.replace(cleanup, cleanup + '\n\n  WRITE_ONCE (frida_hooks_ready, false);', 1)
              ping = '  if (op == FRIDA_CONTROL_OP_PING)\n    return FRIDA_CONTROL_MAGIC;'
              if code.count(ping) != 1:
                  raise SystemExit("cannot locate control readiness probe")
              code = code.replace(ping, '  if (op == FRIDA_CONTROL_OP_PING)\n'
                                  '    return READ_ONCE (frida_hooks_ready) ? FRIDA_CONTROL_MAGIC : -EAGAIN;', 1)

              old_bridge = 'pub fn install_hooks() {\n    unsafe { frida_kmod_install_hooks() };\n}'
              new_bridge = 'pub fn install_hooks() -> bool {\n    unsafe { frida_kmod_install_hooks() == 0 }\n}'
              if bridge.count(old_bridge) != 1 or bridge.count('    fn frida_kmod_install_hooks();') != 1:
                  raise SystemExit("unexpected Rust hook installation ABI")
              bridge = bridge.replace(old_bridge, new_bridge, 1).replace(
                  '    fn frida_kmod_install_hooks();', '    fn frida_kmod_install_hooks() -> c_int;', 1)
              begin = '#[cfg(feature = "linux")]\nmod entrypoint_linux {\n'
              end = '\n#[cfg(feature = "linux")]\npub use entrypoint_linux::'
              start = rust.index(begin)
              stop = rust.index(end, start)
              module = rust[start:stop]
              old_call = '            kernel::install_hooks();'
              if module.count(old_call) != 1:
                  raise SystemExit("unexpected Linux worker hook initialization")
              module = module.replace(old_call,
                  '            if !kernel::install_hooks() {\n'
                  '                kernel::log("rt: required hooks unavailable\\n\\0");\n'
                  '                WORKER_EXITED.store(true, Ordering::Release);\n'
                  '                return;\n'
                  '            }', 1)
              rust = rust[:start] + module + rust[stop:]
              code += '\n' + marker + '\n'

          # Change visible labels only. Control magic, RPC strings and C/Rust
          # symbol names are protocol/linker interfaces and remain unchanged.
          dev_name = re.compile(r'(static struct miscdevice frida_dev\s*=\s*\{[^}]*?\.name\s*=\s*)"[^"]+"', re.S)
          code, count = dev_name.subn(lambda m: m[1] + json.dumps(device), code)
          if count != 1:
              raise SystemExit("cannot uniquely locate the device registration name")
          code = code.replace('"frida-agent"', '"rt-worker"').replace('"frida-op"', '"rt-control"')
          code = code.replace('MODULE_DESCRIPTION ("Frida instrumentation agent");',
                              'MODULE_DESCRIPTION ("ARM64 runtime support");')
          code = code.replace('"frida: ', '"rt: ')
          rust = rust.replace('"frida: ', '"rt: ')
          visibility = 'MODULE_INFO (fage_visibility, "visible-names-v1");'
          if visibility not in code:
              code += '\n' + visibility + '\n'
          for needle in (marker, visibility, 'int frida_kmod_install_hooks (void);',
                         'module_param_named (hooks_ready, frida_hooks_ready, bool, 0444);'):
              if code.count(needle) != 1:
                  raise SystemExit(f"profile verification failed: {needle}")
          if (bridge.count('fn frida_kmod_install_hooks() -> c_int;') != 1
                  or rust.count('if !kernel::install_hooks() {') != 1):
              raise SystemExit("C/Rust hook readiness handoff verification failed")
          config_data = json.loads(config.read_text())
          transport = config_data["agent"]["transport"]
          if transport["type"] != "device" or transport["path"] not in ("/dev/frida", f"/dev/{device}"):
              raise SystemExit("unexpected device transport configuration")
          transport["path"] = f"/dev/{device}"
          for path, content in ((cfile, code), (backend, bridge), (entrypoint, rust),
                                (config, json.dumps(config_data, indent=2) + '\n')):
              if path.read_text() != content:
                  path.write_text(content)
          print(f"Fixed device: /dev/{device}; required hooks: {len(hooks)}; rollback enabled")
          PY_PROFILE

      - name: 编译 fage.ko
        run: |
          set -euo pipefail
          export PATH="$WORKDIR/clang18/bin:$HOME/.cargo/bin:$PATH"
          ccache --max-size "$CCACHE_MAXSIZE"
          CARGO_BUILD_JOBS="$(nproc)"
          export CARGO_BUILD_JOBS
          export GUMJS_DEVKIT_DIR="$WORKDIR/gumjs-devkit"
          make -j"$(nproc)" -C "$WORKDIR/frida-core/src/barebone/agent/linux" \
            ARCH=arm64 BITS=64 \
            FRIDA_SDK="$WORKDIR/sdk-none-arm64-softfloat_nopic" \
            GUMJS_DEVKIT_DIR="$GUMJS_DEVKIT_DIR" \
            AGENT_CC="$FRIDA_AGENT_CLANG" \
            AGENT_LD=aarch64-linux-gnu-ld \
            AGENT_AR=aarch64-linux-gnu-ar \
            AGENT_NM=aarch64-linux-gnu-nm \
            AGENT_OBJCOPY=aarch64-linux-gnu-objcopy \
            MODULE_NAME="$AGENT_MODULE_NAME" \
            KDIR="$WORKDIR/common" KOUT="$WORKDIR/common/out" \
            LLVM=1 CC='ccache clang' HOSTCC=gcc HOSTCXX=g++
          ccache --show-stats

      - name: 保存 Cargo 和 C 编译缓存
        if: steps.compile-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cache/frida-ccache
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            kernel_workspace/frida-core/src/barebone/agent/target-linux
          key: ${{ steps.compile-cache.outputs.cache-primary-key }}

      - name: 检查并整理模块产物
        run: |
          set -euo pipefail
          KO="$WORKDIR/frida-core/src/barebone/agent/linux/$AGENT_MODULE_NAME.ko"
          OUTPUT="$WORKDIR/frida-output"
          KOUT="$WORKDIR/common/out"
          test -s "$KO"
          file "$KO"
          EXPECTED_RELEASE="$(cat "$KOUT/include/config/kernel.release")"
          VERMAGIC="$(modinfo -F vermagic "$KO")"
          test "${VERMAGIC%% *}" = "$EXPECTED_RELEASE"
          test "$(modinfo -F name "$KO")" = "$AGENT_MODULE_NAME"
          test "$(modinfo -F fage_compat "$KO")" = 'android6.6-pid-v1'
          test "$(modinfo -F fage_context_compat "$KO")" = 'ucounts-v1'
          test "$(modinfo -F fage_callback_compat "$KO")" = 'module-notifier-cfi-v1'
          test "$(modinfo -F fage_thread_abi "$KO")" = 'arm64-tagged-addr-v1'
          test "$(modinfo -F fage_init_compat "$KO")" = 'module-init-constructors-v2'
          test "$(modinfo -F fage_cloak_compat "$KO")" = 'hook-integrity-v1'
          test "$(modinfo -F fage_visibility "$KO")" = 'visible-names-v1'
          mkdir -p "$OUTPUT"
          # Check the final Kbuild-linked ELF, including cached Cargo inputs.
          # The worker must have no remaining references to reclaimable init data.
          python3 - "$KO" <<'PY_VERIFY_INIT' | tee "$OUTPUT/init-array-check.txt"
          import sys
          from elftools.elf.elffile import ELFFile
          from elftools.elf.relocation import RelocationSection

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          with open(sys.argv[1], "rb") as stream:
              elf = ELFFile(stream)
              require(elf.elfclass == 64 and elf["e_machine"] == "EM_AARCH64"
                      and elf["e_type"] == "ET_REL", "expected an ARM64 relocatable module")
              table_index = elf.get_section_index(".init_array")
              require(table_index is not None, "missing original .init_array section")
              table = elf.get_section(table_index)
              require(table["sh_flags"] & 2, "constructor table is not allocated")
              for section in elf.iter_sections():
                  require(not (section["sh_flags"] & 2 and section.name.startswith(".frida_init_array")),
                          "obsolete resident constructor section remains")
              symbols = elf.get_section_by_name(".symtab")
              require(symbols is not None, "module symbol table is missing")
              bounds = []
              for name in ("_agent_init_start", "_agent_init_end"):
                  matches = symbols.get_symbol_by_name(name) or []
                  require(len(matches) == 1, f"missing or ambiguous constructor bound: {name}")
                  symbol = matches[0]
                  require(symbol["st_shndx"] == table_index, f"{name} is outside the original table")
                  bounds.append(symbol["st_value"])
              start, end = bounds
              require(0 <= start < end <= table["sh_size"] and start % 8 == end % 8 == 0,
                      "invalid ARM64 constructor table bounds")
              entrypoints = symbols.get_symbol_by_name("frida_agent_start") or []
              require(len(entrypoints) == 1, "missing or ambiguous module-init agent entrypoint")
              entrypoint = entrypoints[0]
              require(isinstance(entrypoint["st_shndx"], int) and entrypoint["st_size"] > 0,
                      "invalid module-init agent entrypoint")
              entry_start = entrypoint["st_value"]
              entry_end = entry_start + entrypoint["st_size"]
              referenced_bounds = set()
              for section in elf.iter_sections():
                  if not isinstance(section, RelocationSection):
                      continue
                  caller = elf.get_section(section["sh_info"])
                  if not caller["sh_flags"] & 2:
                      continue
                  relocation_symbols = elf.get_section(section["sh_link"])
                  for relocation in section.iter_relocations():
                      target = relocation_symbols.get_symbol(relocation["r_info_sym"])
                      if target["st_shndx"] != table_index:
                          continue
                      require(section["sh_info"] == entrypoint["st_shndx"]
                              and entry_start <= relocation["r_offset"] < entry_end,
                              f"constructor table referenced outside module-init entrypoint: {caller.name}")
                      referenced_bounds.add(target["st_value"] + relocation["r_addend"])
              require({start, end}.issubset(referenced_bounds),
                      "module-init entrypoint does not reference both constructor bounds")
              slots = set()
              for section in elf.iter_sections():
                  if not isinstance(section, RelocationSection) or section["sh_info"] != table_index:
                      continue
                  relocation_symbols = elf.get_section(section["sh_link"])
                  for relocation in section.iter_relocations():
                      offset = relocation["r_offset"]
                      if not start <= offset < end:
                          continue
                      require(relocation["r_info_type"] == 257 and offset % 8 == 0,
                              "unexpected constructor relocation; expected R_AARCH64_ABS64")
                      require(offset not in slots, "duplicate constructor relocation")
                      target = relocation_symbols.get_symbol(relocation["r_info_sym"])
                      require(isinstance(target["st_shndx"], int), "unresolved constructor target")
                      target_section = elf.get_section(target["st_shndx"])
                      require(target_section["sh_flags"] & 2 and target_section["sh_flags"] & 4
                              and not target_section.name.startswith((".init", ".exit")),
                              "constructor target is outside resident executable memory")
                      slots.add(offset)
              require(slots == set(range(start, end, 8)), "constructor relocation coverage is incomplete")
              print("Frida init compatibility: module-init-constructors-v2")
              print(f"Section: {table.name}; size={table['sh_size']}; flags={table['sh_flags']:#x}")
              print(f"Constructor bounds: {start:#x}..{end:#x}; entries={len(slots)}")
              print("Verified: original init layout retained; table references confined to frida_agent_start")
              print("Verified: asynchronous worker has no constructor-table references")
          PY_VERIFY_INIT
          cp "$KO" "$OUTPUT/fage.ko"
          cp "$WORKDIR/frida-core/src/barebone/agent/etc/linux-kmod.json" "$OUTPUT/"
          cp "$KOUT/.config" "$OUTPUT/kernel.config"
          cp "$KOUT/Module.symvers" "$KOUT/include/config/kernel.release" "$OUTPUT/"
          modinfo "$KO" > "$OUTPUT/modinfo.txt"
          printf '%s\n' "$VERMAGIC" > "$OUTPUT/vermagic.txt"
          aarch64-linux-gnu-nm -u "$KO" > "$OUTPUT/undefined-symbols.txt"
          {
            echo "Frida version: $FRIDA_VERSION"
            echo "Frida commit: $FRIDA_SHA"
            echo 'Frida compatibility: android6.6-pid-v1 (two-argument detach_pid, CFI enabled)'
             echo 'Frida thread context: ucounts-v1 (balanced RLIMIT_NPROC credential transfer)'
             echo 'Frida callback boundary: module-notifier-cfi-v1 (C/Rust notifier boundary only; kernel CFI retained)'
             echo 'Frida thread ABI: arm64-tagged-addr-v1 (inherit target tagged-address ABI before userspace entry)'
            echo 'Frida init table: module-init-constructors-v2 (run constructors before spawning worker; original ELF layout retained)'
            echo "Module name: $AGENT_MODULE_NAME"
            echo "Fixed device: /dev/$AGENT_DEVICE_NAME"
            echo 'Hook integrity: all seven required hooks checked; partial installation rolled back'
            echo 'Visible labels reduced; protocol constants and linker symbols retained'
            echo "Kernel release: $EXPECTED_RELEASE"
            echo "Kernel source: $KERNEL_REPO@$KERNEL_SHA"
            echo "Config SHA256: $(sha256sum "$KOUT/.config" | cut -d ' ' -f1)"
            echo "GitHub run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            rustc --version
            "$FRIDA_AGENT_CLANG" --version
            "$WORKDIR/clang18/bin/clang" --version
          } > "$OUTPUT/build-info.txt"
          cat > "$OUTPUT/install.txt" <<'INSTALL_EOF'
          # 目标设备的内核源码、配置和符号 CRC 必须与构建依赖匹配。
          # 先用 adb shell cat /proc/sys/kernel/osrelease 对照 kernel.release。
          # uname -r 可能被 SUSFS 改写，不能只比较 6.6.66 或修改后缀冒充 ABI 匹配。
          # 先替换安装包中的 files/fage.ko，再打包安装并重启。
          # 不要在旧模块仍加载时叠加加载新版模块。
          adb push fage.ko /data/adb/app-desc/
          adb shell su -c 'insmod /data/adb/app-desc/fage.ko'
          adb shell su -c 'ls -l /dev/fage'
          adb shell su -c 'cat /sys/module/fage/parameters/hooks_ready'
          adb shell su -c 'dmesg | tail -100'
            # 用 modinfo -F fage_callback_compat fage.ko 确认输出
            # module-notifier-cfi-v1；缺少该标记的旧产物仍可能在后续模块事件时 CFI panic。
            # modinfo -F fage_thread_abi fage.ko 应输出 arm64-tagged-addr-v1；
            # 此补丁修复 ART futex 的 EFAULT，无需修改 JS 或禁用 JVMTI。
          # modinfo -F fage_init_compat fage.ko 应输出 module-init-constructors-v2；
          # init-array-check.txt 应确认仅 frida_agent_start 引用构造函数表，worker 不再引用。
          # 保留旧版 .init_array 布局；在模块入口返回前使用完该表，修复启动竞态 panic。
            # 若旧模块已触发 dec_rlimit_ucounts 下溢及 pthread_create(EAGAIN)，
            # 替换 .ko 不会重置 UID 的运行时计数；需重启后加载新模块再验收。
            # 不加载任何兼容脚本，先验证 Java bridge 的原始初始化路径：
            frida -H 127.0.0.1:27043 -f com.xingin.xhs -e 'Java.perform(() => console.log("Java ready"))'
          INSTALL_EOF
          (cd "$OUTPUT" && sha256sum fage.ko > fage.ko.sha256)
          {
            echo "### Frida Barebone $FRIDA_VERSION"
            echo "- Kernel: \`$EXPECTED_RELEASE\`"
            echo "- Kernel dependency cache: ${{ steps.kernel-cache.outputs.cache-hit == 'true' && 'hit' || 'miss (generated)' }}"
            echo "- Compile cache: ${{ steps.compile-cache.outputs.cache-hit == 'true' && 'hit' || 'miss or fallback' }}"
            echo '- 唯一编译产物：fage.ko；附带配置、符号表和诊断信息。'
             echo '- 线程凭据补丁：ucounts-v1；迁移 RLIMIT_NPROC 计数，避免注入线程退出时扣错 UID。'
             echo '- 模块通知补丁：module-notifier-cfi-v1；修复 C 调用 Rust 模块事件回调时的 CFI panic。'
             echo '- 线程 ABI 补丁：arm64-tagged-addr-v1；继承带标签地址 ABI，修复 ART futex 的 EFAULT。'
            echo '- 初始化表补丁：module-init-constructors-v2；保留旧版节布局，构造函数移至启动 worker 之前。'
            echo '- 可见名称：模块 fage，固定节点 /dev/fage，线程 rt-worker / rt-control。'
            echo '- 隐藏钩子完整性：七个钩子全部成功才报告就绪；失败回滚，不开放设备服务。'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 fage.ko
        uses: actions/upload-artifact@v7
        with:
          name: Frida-Barebone-${{ env.FRIDA_VERSION }}-${{ env.KERNEL_VERSION }}
          path: kernel_workspace/frida-output/
          if-no-files-found: error
          retention-days: 30
          compression-level: 1
