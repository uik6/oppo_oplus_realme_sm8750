name: Frida Barebone 6.6.66 模块构建

on:
  workflow_dispatch:
    inputs:
      kernel_suffix:
        description: '目标内核后缀（不含开头的 -；留空使用原默认后缀，必须与 uname -r 匹配）'
        type: string
        default: ''
      kernel_config_url:
        description: '可选：目标内核 .config 的 HTTPS 下载地址；留空使用源码的 gki_defconfig'
        type: string
        default: ''
      cache_epoch:
        description: '缓存代号；需要强制重建全部依赖时修改此值'
        type: string
        default: 'v1'

permissions:
  contents: read

concurrency:
  group: frida-barebone-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  TZ: Asia/Shanghai
  KERNEL_VERSION: '6.6.66'
  KERNEL_REPO: cctv18/android_kernel_common_oneplus_sm8750
  KERNEL_BRANCH: oneplus/sm8750_v_15.0.2_oneplus_13_6.6.66
  KERNEL_NAME: android15-8-g29d86c5fc9dd-abogki428889875-4k
  KERNEL_CLANG_URL: https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang18-r510928/clang-r510928.zip
  FRIDA_VERSION: '17.25.2'
  RUSTUP_TOOLCHAIN: stable
  CARGO_INCREMENTAL: '0'
  CCACHE_MAXSIZE: 2G
  CCACHE_COMPILERCHECK: content
  CCACHE_COMPRESS: 'true'
  KBUILD_BUILD_USER: frida
  KBUILD_BUILD_HOST: github-actions
  KBUILD_BUILD_TIMESTAMP: '2025-05-25 12:00:00 +0800'
  LOCALVERSION: ''

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: 初始化目录并解析源码版本
        id: sources
        env:
          INPUT_KERNEL_SUFFIX: ${{ inputs.kernel_suffix }}
          INPUT_CONFIG_URL: ${{ inputs.kernel_config_url }}
          INPUT_CACHE_EPOCH: ${{ inputs.cache_epoch }}
        run: |
          set -euo pipefail
          WORKDIR="$GITHUB_WORKSPACE/kernel_workspace"
          mkdir -p "$WORKDIR"
          {
            echo "WORKDIR=$WORKDIR"
            echo "CCACHE_DIR=$HOME/.cache/frida-ccache"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
          } >> "$GITHUB_ENV"

          SUFFIX="${INPUT_KERNEL_SUFFIX:-$KERNEL_NAME}"
          if [[ ! "$SUFFIX" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]; then
            echo '::error::内核后缀只能包含字母、数字、点、下划线、加号和连字符，且不能以连字符开头'
            exit 1
          fi
          echo "KERNEL_LOCALVERSION=-$SUFFIX" >> "$GITHUB_ENV"

          KERNEL_SHA="$(git ls-remote "https://github.com/$KERNEL_REPO.git" \
            "refs/heads/$KERNEL_BRANCH" | awk 'NR == 1 { print $1 }')"
          FRIDA_SHA="$(git ls-remote https://github.com/frida/frida-core.git \
            "refs/tags/$FRIDA_VERSION" "refs/tags/$FRIDA_VERSION^{}" | awk 'END { print $1 }')"
          [[ "$KERNEL_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$FRIDA_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "KERNEL_SHA=$KERNEL_SHA" >> "$GITHUB_ENV"
          echo "FRIDA_SHA=$FRIDA_SHA" >> "$GITHUB_ENV"

          # 配置内容参与缓存键；相同 URL 的内容变更也会重建内核依赖。
          : > "$WORKDIR/kernel.config.input"
          if [ -n "$INPUT_CONFIG_URL" ]; then
            [[ "$INPUT_CONFIG_URL" == https://* ]]
            curl --fail --location --retry 5 --proto '=https' --proto-redir '=https' \
              "$INPUT_CONFIG_URL" -o "$WORKDIR/kernel.config.input"
            grep -q '^CONFIG_ARM64=y' "$WORKDIR/kernel.config.input"
          fi
          EPOCH="$(printf '%s' "$INPUT_CACHE_EPOCH" | sha256sum | cut -c1-16)"
          {
            echo "epoch=$EPOCH"
            echo "frida=$FRIDA_SHA"
            echo "clang=$(printf '%s' "$KERNEL_CLANG_URL" | sha256sum | cut -c1-24)"
          } >> "$GITHUB_OUTPUT"

      - name: 安装构建依赖
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison flex build-essential libssl-dev libelf-dev libzstd-dev \
            python3 curl git unzip xz-utils zstd ccache dwarves kmod \
            binutils-aarch64-linux-gnu clang-19 libclang-19-dev
          echo 'FRIDA_AGENT_CLANG=/usr/bin/clang-19' >> "$GITHUB_ENV"
          echo 'LIBCLANG_PATH=/usr/lib/llvm-19/lib' >> "$GITHUB_ENV"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup component add rust-src
          rustup target add aarch64-unknown-none
          rustc --version
          /usr/bin/clang-19 --version

      - name: 恢复内核 Clang 工具链
        id: clang-cache
        uses: actions/cache/restore@v5
        with:
          path: kernel_workspace/clang18
          key: frida-clang18-${{ runner.os }}-${{ steps.sources.outputs.clang }}-${{ steps.sources.outputs.epoch }}

      - name: 下载内核 Clang 工具链
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 "$KERNEL_CLANG_URL" -o "$RUNNER_TEMP/clang18.zip"
          mkdir -p "$WORKDIR/clang18"
          unzip -q "$RUNNER_TEMP/clang18.zip" -d "$WORKDIR/clang18"
          test -x "$WORKDIR/clang18/bin/clang"
          rm -f "$RUNNER_TEMP/clang18.zip"

      - name: 保存内核 Clang 工具链
        if: steps.clang-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: kernel_workspace/clang18
          key: ${{ steps.clang-cache.outputs.cache-primary-key }}

      - name: 恢复 Frida 源码、GumJS 与 SDK
        id: frida-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            kernel_workspace/frida-core
            kernel_workspace/gumjs-devkit
            kernel_workspace/sdk-none-arm64-softfloat_nopic
          key: frida-sdk-${{ runner.os }}-${{ steps.sources.outputs.frida }}-${{ steps.sources.outputs.epoch }}

      - name: 下载 Frida 源码和依赖
        if: steps.frida-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth=1 --single-branch --branch "$FRIDA_VERSION" \
            https://github.com/frida/frida-core.git "$WORKDIR/frida-core"
          test "$(git -C "$WORKDIR/frida-core" rev-parse HEAD)" = "$FRIDA_SHA"
          # SDK 同步工具依赖 releng 内部固定版本的 tomlkit 和 Meson 子模块。
          git -C "$WORKDIR/frida-core" submodule update --init --recursive --depth=1 releng
          python3 "$WORKDIR/frida-core/releng/deps.py" --help > /dev/null

          # 独立下载任务并行运行，逐个等待，任一失败都会使步骤失败。
          (
            curl --fail --location --retry 5 \
              "https://github.com/frida/frida/releases/download/$FRIDA_VERSION/frida-gumjs-devkit-$FRIDA_VERSION-none-arm64-softfloat_nopic.tar.xz" \
              -o "$RUNNER_TEMP/frida-gumjs.tar.xz"
            mkdir -p "$WORKDIR/gumjs-devkit"
            tar -xJf "$RUNNER_TEMP/frida-gumjs.tar.xz" -C "$WORKDIR/gumjs-devkit"
            rm -f "$RUNNER_TEMP/frida-gumjs.tar.xz"
          ) &
          GUMJS_PID=$!
          (
            cd "$WORKDIR/frida-core"
            ./releng/deps.py sync sdk none-arm64-softfloat_nopic \
              "$WORKDIR/sdk-none-arm64-softfloat_nopic"
          ) &
          SDK_PID=$!
          STATUS=0
          wait "$GUMJS_PID" || STATUS=1
          wait "$SDK_PID" || STATUS=1
          exit "$STATUS"

      - name: 保存未修改的 Frida 源码和依赖
        if: steps.frida-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            kernel_workspace/frida-core
            kernel_workspace/gumjs-devkit
            kernel_workspace/sdk-none-arm64-softfloat_nopic
          key: ${{ steps.frida-cache.outputs.cache-primary-key }}

      - name: 生成内核依赖构建脚本和缓存键
        id: keys
        env:
          CACHE_EPOCH: ${{ steps.sources.outputs.epoch }}
        run: |
          set -euo pipefail
          echo "$WORKDIR/clang18/bin" >> "$GITHUB_PATH"
          cat > "$RUNNER_TEMP/prepare-frida-kernel.sh" <<'KERNEL_SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          KDIR="$WORKDIR/common"
          KOUT="$KDIR/out"
          mkdir -p "$KDIR"
          curl --fail --location --retry 5 \
            "https://codeload.github.com/$KERNEL_REPO/tar.gz/$KERNEL_SHA" \
            -o "$RUNNER_TEMP/kernel.tar.gz"
          tar -xzf "$RUNNER_TEMP/kernel.tar.gz" --strip-components=1 -C "$KDIR"
          rm -f "$RUNNER_TEMP/kernel.tar.gz"
          # 清除上游快照可能携带的配置，保持 O= 构建的源码树干净。
          rm -f "$KDIR/.config"
          rm -rf "$KDIR/include/config" "$KDIR/arch/arm64/include/generated"
          export PATH="$WORKDIR/clang18/bin:$PATH"
          MAKE_ARGS=(-C "$KDIR" O="$KOUT" ARCH=arm64 LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu- CC='ccache clang' HOSTCC=gcc HOSTCXX=g++)
          if [ -s "$WORKDIR/kernel.config.input" ]; then
            mkdir -p "$KOUT"
            cp "$WORKDIR/kernel.config.input" "$KOUT/.config"
          else
            make "${MAKE_ARGS[@]}" gki_defconfig
          fi
          "$KDIR/scripts/config" --file "$KOUT/.config" \
            --set-str LOCALVERSION "$KERNEL_LOCALVERSION" \
            --disable LOCALVERSION_AUTO --disable HEADERS_INSTALL
          make "${MAKE_ARGS[@]}" olddefconfig
          for OPT in CONFIG_MODULES CONFIG_KPROBES CONFIG_KALLSYMS_ALL; do
            if ! grep -q "^$OPT=y$" "$KOUT/.config"; then
              echo "::error::目标配置需要 $OPT=y"
              exit 1
            fi
          done
          if grep -qE '^CONFIG_(MODULE_SIG_FORCE|TRIM_UNUSED_KSYMS)=y$' "$KOUT/.config"; then
            echo '::error::此工作流要求关闭 MODULE_SIG_FORCE 和 TRIM_UNUSED_KSYMS'
            exit 1
          fi

          # modpost 依赖 vmlinux.o，生成真实 CRC；modules_prepare 生成外部模块工具。
          # 跳过最终 vmlinux 链接、Image、DTB 和所有内置 .ko 的构建。
          make -j"$(nproc)" "${MAKE_ARGS[@]}" modpost modules_prepare
          test -s "$KOUT/vmlinux.symvers"
          cp "$KOUT/vmlinux.symvers" "$KOUT/Module.symvers"

          # 缓存只保留外部模块所需目录，避免存储数 GB 的内核中间目标文件。
          PREPARED="$WORKDIR/kernel-prepared"
          mkdir -p "$PREPARED/arch/arm64"
          cp -a "$KOUT/.config" "$KOUT/Makefile" "$KOUT/Module.symvers" \
            "$KOUT/include" "$KOUT/scripts" "$PREPARED/"
          cp -a "$KOUT/arch/arm64/include" "$PREPARED/arch/arm64/"
          ln -s "$KDIR" "$PREPARED/source"
          rm -rf "$KOUT"
          mv "$PREPARED" "$KOUT"
          KERNEL_SCRIPT

          # 源码、实际配置、构建脚本和编译器任何一个变化都会使依赖缓存失效。
          KERNEL_KEY="$(
            {
              printf '%s\n' "$CACHE_EPOCH" "$KERNEL_SHA" "$KERNEL_LOCALVERSION"
              sha256sum "$RUNNER_TEMP/prepare-frida-kernel.sh" "$WORKDIR/kernel.config.input"
              "$WORKDIR/clang18/bin/clang" --version
              gcc --version
            } | sha256sum | cut -d ' ' -f1
          )"
          TOOL_KEY="$(
            {
              rustc -vV
              "$FRIDA_AGENT_CLANG" --version
              "$WORKDIR/clang18/bin/clang" --version
              aarch64-linux-gnu-ld --version
            } | sha256sum | cut -c1-24
          )"
          # 编译缓存可跨配置回退，Kbuild/ccache/Cargo 自己检查内容与依赖；
          # 已准备内核的缓存必须精确命中，禁止回退到其他配置的 Module.symvers。
          WORKFLOW_HASH="${GITHUB_WORKFLOW_SHA:-$GITHUB_SHA}"
          {
            echo "kernel=frida-kernel-${RUNNER_OS}-$KERNEL_KEY"
            echo "compile-prefix=frida-compile-${RUNNER_OS}-$CACHE_EPOCH-$TOOL_KEY-"
            echo "compile=frida-compile-${RUNNER_OS}-$CACHE_EPOCH-$TOOL_KEY-$KERNEL_KEY-$FRIDA_SHA-$WORKFLOW_HASH"
          } >> "$GITHUB_OUTPUT"

      - name: 恢复已准备的内核环境
        id: kernel-cache
        uses: actions/cache/restore@v5
        with:
          path: kernel_workspace/common
          key: ${{ steps.keys.outputs.kernel }}

      - name: 恢复 Cargo 和 C 编译缓存
        id: compile-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cache/frida-ccache
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            kernel_workspace/frida-core/src/barebone/agent/target-linux
          key: ${{ steps.keys.outputs.compile }}
          restore-keys: |
            ${{ steps.keys.outputs.compile-prefix }}

      - name: 首次生成内核依赖
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ccache --max-size "$CCACHE_MAXSIZE"
          ccache --zero-stats
          bash "$RUNNER_TEMP/prepare-frida-kernel.sh"

      - name: 验证内核和 Frida 依赖
        run: |
          set -euo pipefail
          KOUT="$WORKDIR/common/out"
          for REQUIRED in \
            "$KOUT/.config" \
            "$KOUT/Module.symvers" \
            "$KOUT/include/config/auto.conf" \
            "$KOUT/include/generated/autoconf.h" \
            "$KOUT/include/config/kernel.release" \
            "$KOUT/scripts/mod/modpost" \
            "$KOUT/scripts/module.lds" \
            "$WORKDIR/gumjs-devkit/libfrida-gumjs.a" \
            "$WORKDIR/sdk-none-arm64-softfloat_nopic/lib/libc.a" \
            "$WORKDIR/sdk-none-arm64-softfloat_nopic/lib/libm.a" \
            "$WORKDIR/sdk-none-arm64-softfloat_nopic/lib/libclang_rt.builtins.a"
          do
            test -s "$REQUIRED"
          done
          EXPECTED_RELEASE="$KERNEL_VERSION$KERNEL_LOCALVERSION"
          test "$(cat "$KOUT/include/config/kernel.release")" = "$EXPECTED_RELEASE"
          echo "Kernel release: $EXPECTED_RELEASE"
          echo "Kernel commit: $KERNEL_SHA"
          wc -l "$KOUT/Module.symvers"
          du -sh "$WORKDIR/common" "$WORKDIR/clang18"

      - name: 保存已准备的内核环境
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: kernel_workspace/common
          key: ${{ steps.kernel-cache.outputs.cache-primary-key }}

      - name: 应用 Frida Android 6.6 / OPlus 兼容补丁
        run: |
          set -euxo pipefail

          FRIDA_LINUX="$WORKDIR/frida-core/src/barebone/agent/linux"
          export FRIDA_LINUX

          test -f "$FRIDA_LINUX/frida-kmod.c"
          test -f "$FRIDA_LINUX/Kbuild"

          python3 <<'PY_PATCH'
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["FRIDA_LINUX"])
          src = root / "frida-kmod.c"
          kbuild = root / "Kbuild"

          text = src.read_text()

          # Frida 17.25.2 assumes the newer detach_pid(freed, task, type) API.
          # Android 6.6 uses detach_pid(task, type), which frees unused PIDs itself.
          # Calling it with the newer prototype triggers a fatal CFI failure.
          pid_header = Path(os.environ["WORKDIR"]) / "common/include/linux/pid.h"
          legacy_detach = re.compile(
              r"\bvoid\s+detach_pid\s*\(\s*struct\s+task_struct\s*\*\s*\w*\s*,"
              r"\s*enum\s+pid_type\s*\w*\s*\)\s*;"
          )
          if not legacy_detach.search(pid_header.read_text()):
              raise SystemExit('expected Android 6.6 two-argument detach_pid declaration')

          pid_include = '#include <linux/pid.h>\n'
          if pid_include not in text:
              needle = '#include <linux/poll.h>\n'
              if needle not in text:
                  raise SystemExit('cannot locate linux/poll.h include')
              text = text.replace(needle, pid_include + needle, 1)

          typed_detach = 'typedef __typeof__ (&detach_pid) FridaDetachPidFunc;'
          if typed_detach not in text:
              replacements = [
                  (
                      'typedef void (* FridaDetachPidFunc) (struct pid ** pids, struct task_struct * task, enum pid_type type);',
                      typed_detach,
                  ),
                  ('typedef void (* FridaFreePidsFunc) (struct pid ** pids);\n', ''),
                  ('static FridaFreePidsFunc frida_free_pids_impl;\n', ''),
                  ('  frida_free_pids_impl = (FridaFreePidsFunc) frida_kmod_find_function ("free_pids");\n', ''),
                  ('  struct pid * freed[PIDTYPE_MAX] = { NULL };\n', ''),
                  ('  frida_free_pids_impl (freed);\n', ''),
              ]
              for pid_type in ('SID', 'PGID', 'TGID'):
                  replacements.append((
                      f'  frida_detach_pid_impl (freed, child, PIDTYPE_{pid_type});',
                      f'  frida_detach_pid_impl (child, PIDTYPE_{pid_type});',
                  ))
              for old, new in replacements:
                  if text.count(old) != 1:
                      raise SystemExit(f'cannot uniquely locate PID compatibility patch target: {old}')
                  text = text.replace(old, new, 1)

          if 'frida_free_pids_impl' in text or 'frida_detach_pid_impl (freed,' in text:
              raise SystemExit('incompatible PID API remains after patch')
          compat_info = 'MODULE_INFO (frida_compat, "android6.6-pid-v1");'
          if compat_info not in text:
              text += '\n' + compat_info + '\n'

          # Android/Linux 6.6 keeps the full struct kernel_symbol definition in
          # kernel/module/internal.h while linux/module.h only forward-declares it.
          # Frida 17.25.2 directly dereferences kernel_symbol fields, so make the
          # target kernel's internal definition visible to this external module.
          needle = '#include <linux/module.h>\n'
          replacement = '#include <linux/module.h>\n#include "internal.h"\n'
          if '#include "internal.h"' not in text:
              if needle not in text:
                  raise SystemExit('cannot locate linux/module.h include')
              text = text.replace(needle, replacement, 1)

          # task_struct::sysvsem only exists when CONFIG_SYSVIPC=y. Frida 17.25.2
          # accesses it unconditionally. On Android GKI/OKI kernels with SYSVIPC
          # disabled, there is no semaphore undo-list state to inherit, so compile
          # that part only when the kernel actually provides the field.
          old_decl = '  const struct cred * old_real_cred = current->real_cred;\n  void * undo_list = leader->sysvsem.undo_list;\n  int fs_dead;\n'
          new_decl = '  const struct cred * old_real_cred = current->real_cred;\n#ifdef CONFIG_SYSVIPC\n  void * undo_list = leader->sysvsem.undo_list;\n#endif\n  int fs_dead;\n'
          if new_decl not in text:
              if old_decl not in text:
                  raise SystemExit('cannot locate sysvsem declaration')
              text = text.replace(old_decl, new_decl, 1)

          old_use = '  if (undo_list != NULL)\n  {\n    refcount_inc (&((struct frida_sem_undo_list *) undo_list)->refcnt);\n    current->sysvsem.undo_list = undo_list;\n  }\n'
          new_use = '#ifdef CONFIG_SYSVIPC\n  if (undo_list != NULL)\n  {\n    refcount_inc (&((struct frida_sem_undo_list *) undo_list)->refcnt);\n    current->sysvsem.undo_list = undo_list;\n  }\n#endif\n'
          if new_use not in text:
              if old_use not in text:
                  raise SystemExit('cannot locate sysvsem use block')
              text = text.replace(old_use, new_use, 1)

          if text != src.read_text():
              src.write_text(text)

          ktext = kbuild.read_text()
          inc = 'ccflags-y += -I$(srctree)/kernel/module\n'
          if inc not in ktext:
              ktext += '\n# Android 6.6 keeps struct kernel_symbol in kernel/module/internal.h\n' + inc
          if ktext != kbuild.read_text():
              kbuild.write_text(ktext)
          PY_PATCH

          echo "=== 验证 Frida 兼容补丁 ==="
          grep -n -E 'FridaDetachPidFunc|frida_detach_pid_impl \(child|frida_compat' "$FRIDA_LINUX/frida-kmod.c"
          grep -n 'include "internal.h"' "$FRIDA_LINUX/frida-kmod.c"
          grep -n -A4 -B2 'undo_list = leader->sysvsem.undo_list' "$FRIDA_LINUX/frida-kmod.c"
          tail -n 8 "$FRIDA_LINUX/Kbuild"

      - name: 修复 Frida Android FIFO 分配并增加运行时诊断
        run: |
          set -euxo pipefail

          FRIDA_KMOD="$WORKDIR/frida-core/src/barebone/agent/linux/frida-kmod.c"
          export FRIDA_KMOD
          test -f "$FRIDA_KMOD"

          python3 <<'PY_FIFO'
          import os
          import re
          from pathlib import Path

          p = Path(os.environ["FRIDA_KMOD"])
          text = p.read_text()

          # Add explicit backing-storage pointers next to the two kfifo objects.
          decl_re = re.compile(
              r"(static DECLARE_KFIFO_PTR \(frida_to_client, u8\);\s*\n"
              r"static DECLARE_KFIFO_PTR \(frida_from_client, u8\);\s*\n)"
          )
          if "frida_to_client_storage" not in text:
              text, n = decl_re.subn(
                  r"\1static void * frida_to_client_storage;\n"
                  r"static void * frida_from_client_storage;\n",
                  text,
                  count=1,
              )
              if n != 1:
                  raise SystemExit("cannot locate FIFO declarations")

          # Match the allocation block while tolerating blank lines/whitespace.
          alloc_re = re.compile(
              r"  res = kfifo_alloc \(&frida_to_client, FRIDA_LINK_CAPACITY, GFP_KERNEL\);\s*\n"
              r"  if \(res != 0\)\s*\n"
              r"    return res;\s*\n+"
              r"  res = kfifo_alloc \(&frida_from_client, FRIDA_LINK_CAPACITY, GFP_KERNEL\);\s*\n"
              r"  if \(res != 0\)\s*\n"
              r"    goto free_to_client;"
          )
          new_alloc = (
              "  frida_to_client_storage = kvzalloc (FRIDA_LINK_CAPACITY, GFP_KERNEL);\n"
              "  if (frida_to_client_storage == NULL)\n"
              "  {\n"
              "    printk (KERN_ERR \"frida: failed to allocate to-client FIFO storage (%u bytes)\\n\", FRIDA_LINK_CAPACITY);\n"
              "    return -ENOMEM;\n"
              "  }\n"
              "  res = kfifo_init (&frida_to_client, frida_to_client_storage, FRIDA_LINK_CAPACITY);\n"
              "  if (res != 0)\n"
              "  {\n"
              "    printk (KERN_ERR \"frida: kfifo_init(to-client) failed: %d\\n\", res);\n"
              "    goto free_to_client;\n"
              "  }\n"
              "\n"
              "  frida_from_client_storage = kvzalloc (FRIDA_LINK_CAPACITY, GFP_KERNEL);\n"
              "  if (frida_from_client_storage == NULL)\n"
              "  {\n"
              "    res = -ENOMEM;\n"
              "    printk (KERN_ERR \"frida: failed to allocate from-client FIFO storage (%u bytes)\\n\", FRIDA_LINK_CAPACITY);\n"
              "    goto free_to_client;\n"
              "  }\n"
              "  res = kfifo_init (&frida_from_client, frida_from_client_storage, FRIDA_LINK_CAPACITY);\n"
              "  if (res != 0)\n"
              "  {\n"
              "    printk (KERN_ERR \"frida: kfifo_init(from-client) failed: %d\\n\", res);\n"
              "    goto free_from_client;\n"
              "  }"
          )

          if "failed to allocate to-client FIFO storage" not in text:
              text, n = alloc_re.subn(lambda m: new_alloc, text, count=1)
              if n != 1:
                  pos = text.find("frida_kmod_link_open (void)")
                  snippet = text[pos:pos + 1100] if pos >= 0 else "<link_open not found>"
                  raise SystemExit(
                      "cannot locate FIFO allocation block after whitespace-tolerant match; "
                      "link_open begins as:\n" + snippet
                  )

          labels_re = re.compile(
              r"free_from_client:\s*\n"
              r"  kfifo_free \(&frida_from_client\);\s*\n"
              r"free_to_client:\s*\n"
              r"  kfifo_free \(&frida_to_client\);"
          )
          new_labels = (
              "free_from_client:\n"
              "  kvfree (frida_from_client_storage);\n"
              "  frida_from_client_storage = NULL;\n"
              "free_to_client:\n"
              "  kvfree (frida_to_client_storage);\n"
              "  frida_to_client_storage = NULL;"
          )

          if "free_from_client:\n  kvfree (frida_from_client_storage);" not in text:
              text, n = labels_re.subn(lambda m: new_labels, text, count=1)
              if n != 1:
                  raise SystemExit("cannot locate frida_kmod_link_open() cleanup labels")

          close_re = re.compile(
              r"  misc_deregister \(&frida_dev\);\s*\n"
              r"  kfifo_free \(&frida_from_client\);\s*\n"
              r"  kfifo_free \(&frida_to_client\);"
          )
          new_close = (
              "  misc_deregister (&frida_dev);\n"
              "  kvfree (frida_from_client_storage);\n"
              "  frida_from_client_storage = NULL;\n"
              "  kvfree (frida_to_client_storage);\n"
              "  frida_to_client_storage = NULL;"
          )

          if "misc_deregister (&frida_dev);\n  kvfree (frida_from_client_storage);" not in text:
              text, n = close_re.subn(lambda m: new_close, text, count=1)
              if n != 1:
                  raise SystemExit("cannot locate frida_kmod_link_close() cleanup")

          misc_re = re.compile(
              r"  res = misc_register \(&frida_dev\);\s*\n"
              r"  if \(res != 0\)\s*\n"
              r"    goto free_from_client;"
          )
          new_misc = (
              "  res = misc_register (&frida_dev);\n"
              "  if (res != 0)\n"
              "  {\n"
              "    printk (KERN_ERR \"frida: misc_register(/dev/%s) failed: %d\\n\", frida_dev.name, res);\n"
              "    goto free_from_client;\n"
              "  }"
          )

          if "misc_register(/dev/%s) failed" not in text:
              text, n = misc_re.subn(lambda m: new_misc, text, count=1)
              if n != 1:
                  raise SystemExit("cannot locate misc_register() block")

          if text != p.read_text():
              p.write_text(text)
          PY_FIFO

          echo "=== FIFO patch verification ==="
          grep -n -A28 -B5 'frida_to_client_storage = kvzalloc' "$FRIDA_KMOD"
          grep -n -A8 -B3 'misc_register(/dev/%s) failed' "$FRIDA_KMOD"
          grep -n -A14 'frida_kmod_link_close' "$FRIDA_KMOD" | tail -n 18

      - name: 编译 frida-agent.ko
        run: |
          set -euo pipefail
          export PATH="$WORKDIR/clang18/bin:$HOME/.cargo/bin:$PATH"
          ccache --max-size "$CCACHE_MAXSIZE"
          CARGO_BUILD_JOBS="$(nproc)"
          export CARGO_BUILD_JOBS
          export GUMJS_DEVKIT_DIR="$WORKDIR/gumjs-devkit"
          make -j"$(nproc)" -C "$WORKDIR/frida-core/src/barebone/agent/linux" \
            ARCH=arm64 BITS=64 \
            FRIDA_SDK="$WORKDIR/sdk-none-arm64-softfloat_nopic" \
            GUMJS_DEVKIT_DIR="$GUMJS_DEVKIT_DIR" \
            AGENT_CC="$FRIDA_AGENT_CLANG" \
            AGENT_LD=aarch64-linux-gnu-ld \
            AGENT_AR=aarch64-linux-gnu-ar \
            AGENT_NM=aarch64-linux-gnu-nm \
            AGENT_OBJCOPY=aarch64-linux-gnu-objcopy \
            KDIR="$WORKDIR/common" KOUT="$WORKDIR/common/out" \
            LLVM=1 CC='ccache clang' HOSTCC=gcc HOSTCXX=g++
          ccache --show-stats

      - name: 保存 Cargo 和 C 编译缓存
        if: steps.compile-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cache/frida-ccache
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            kernel_workspace/frida-core/src/barebone/agent/target-linux
          key: ${{ steps.compile-cache.outputs.cache-primary-key }}

      - name: 检查并整理模块产物
        run: |
          set -euo pipefail
          KO="$WORKDIR/frida-core/src/barebone/agent/linux/frida-agent.ko"
          OUTPUT="$WORKDIR/frida-output"
          KOUT="$WORKDIR/common/out"
          test -s "$KO"
          file "$KO"
          EXPECTED_RELEASE="$(cat "$KOUT/include/config/kernel.release")"
          VERMAGIC="$(modinfo -F vermagic "$KO")"
          test "${VERMAGIC%% *}" = "$EXPECTED_RELEASE"
          test "$(modinfo -F frida_compat "$KO")" = 'android6.6-pid-v1'
          mkdir -p "$OUTPUT"
          cp "$KO" "$OUTPUT/frida-agent.ko"
          cp "$WORKDIR/frida-core/src/barebone/agent/etc/linux-kmod.json" "$OUTPUT/"
          cp "$KOUT/.config" "$OUTPUT/kernel.config"
          cp "$KOUT/Module.symvers" "$KOUT/include/config/kernel.release" "$OUTPUT/"
          modinfo "$KO" > "$OUTPUT/modinfo.txt"
          printf '%s\n' "$VERMAGIC" > "$OUTPUT/vermagic.txt"
          aarch64-linux-gnu-nm -u "$KO" > "$OUTPUT/undefined-symbols.txt"
          {
            echo "Frida version: $FRIDA_VERSION"
            echo "Frida commit: $FRIDA_SHA"
            echo 'Frida compatibility: android6.6-pid-v1 (two-argument detach_pid, CFI enabled)'
            echo "Kernel release: $EXPECTED_RELEASE"
            echo "Kernel source: $KERNEL_REPO@$KERNEL_SHA"
            echo "Config SHA256: $(sha256sum "$KOUT/.config" | cut -d ' ' -f1)"
            echo "GitHub run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            rustc --version
            "$FRIDA_AGENT_CLANG" --version
            "$WORKDIR/clang18/bin/clang" --version
          } > "$OUTPUT/build-info.txt"
          cat > "$OUTPUT/install.txt" <<'INSTALL_EOF'
          # 目标设备的内核源码、配置和符号 CRC 必须与构建依赖匹配。
          # 先用 adb shell cat /proc/sys/kernel/osrelease 对照 kernel.release。
          # uname -r 可能被 SUSFS 改写，不能只比较 6.6.66 或修改后缀冒充 ABI 匹配。
          adb push frida-agent.ko /data/local/tmp/
          adb shell su -c 'insmod /data/local/tmp/frida-agent.ko'
          adb shell su -c 'ls -l /dev/frida'
          adb shell su -c 'dmesg | tail -100'
          INSTALL_EOF
          (cd "$OUTPUT" && sha256sum frida-agent.ko > frida-agent.ko.sha256)
          {
            echo "### Frida Barebone $FRIDA_VERSION"
            echo "- Kernel: \`$EXPECTED_RELEASE\`"
            echo "- Kernel dependency cache: ${{ steps.kernel-cache.outputs.cache-hit == 'true' && 'hit' || 'miss (generated)' }}"
            echo "- Compile cache: ${{ steps.compile-cache.outputs.cache-hit == 'true' && 'hit' || 'miss or fallback' }}"
            echo '- 唯一编译产物：frida-agent.ko；附带配置、符号表和诊断信息。'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 frida-agent.ko
        uses: actions/upload-artifact@v7
        with:
          name: Frida-Barebone-${{ env.FRIDA_VERSION }}-${{ env.KERNEL_VERSION }}
          path: kernel_workspace/frida-output/
          if-no-files-found: error
          retention-days: 30
          compression-level: 1
